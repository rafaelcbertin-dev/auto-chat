name = "autochat"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Limpeza diária de eventos antigos (03:00 UTC)
[triggers]
crons = ["0 3 * * *"]

[vars]
GRAPH_API_VERSION = "v26.0"
# IDs públicos do app na Meta (login unificado do Instagram)
META_APP_ID = "1084098101307628"
META_LOGIN_CONFIG_ID = "29640439518978612"

[[d1_databases]]
binding = "DB"
database_name = "autochat"
database_id = "f17fc30f-58e8-4eb3-8a43-39ff698e75b0"
migrations_dir = "migrations"

# Segredos (configure com `npx wrangler secret put NOME`):
#   ADMIN_PASSWORD      senha do painel
#   META_VERIFY_TOKEN   texto qualquer, igual ao configurado no webhook da Meta
#   META_APP_SECRET     Chave secreta do app da Meta (Configurações do app › Básico)
#   AUTOCHAT_API_KEY    chave (32+ caracteres) da aba AutoChat do painel da Revenda; a mesma vai no Worker da Revenda
#   (o acesso ao Instagram é feito pelo botão "Conectar Instagram" no painel)
#   WA_ACCESS_TOKEN     token permanente do usuário de sistema (WhatsApp Cloud API)
#   WA_PHONE_NUMBER_ID  ID do número no WhatsApp Cloud API

# Logs no painel da Cloudflare (Workers › autochat › Observability)
[observability]
enabled = true
